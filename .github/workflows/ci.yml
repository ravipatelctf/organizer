name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: organizer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/organizer_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/organizer_test
      AT_SECRET: ci-access-token-secret-not-for-production-use
      RT_SECRET: ci-refresh-token-secret-not-for-production-use
      PORT: 8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Type-check
        run: yarn check-types

      - name: Lint
        run: yarn lint

      # Proves the migration history applies cleanly to an empty database — something
      # local `migrate dev` against the shared Neon branch never checks.
      - name: Apply migrations from scratch
        run: yarn workspace api prisma migrate deploy

      - name: Unit tests
        run: yarn test

      - name: E2E tests
        run: yarn workspace api test:e2e

      - name: Build
        run: yarn build
